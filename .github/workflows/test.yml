name: Automated Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    name: Run Tests & Generate Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Sanitize ref name
        if: always()
        run: |
          REF_NAME="${{ github.head_ref || github.ref_name }}"
          SAFE_REF=$(echo "$REF_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "SAFE_REF=$SAFE_REF" >> $GITHUB_ENV

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ env.SAFE_REF }}-${{ github.run_number }}
          path: coverage/
          retention-days: 30

      - name: Upload HTML test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-test-report-${{ env.SAFE_REF }}-${{ github.run_number }}
          path: html-report/
          retention-days: 30

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Category | Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|----------|" >> $GITHUB_STEP_SUMMARY
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              const fmt = (v) => v.pct + '% (' + v.covered + '/' + v.total + ')';
              console.log('| Statements | ' + fmt(s.statements) + ' |');
              console.log('| Branches   | ' + fmt(s.branches)   + ' |');
              console.log('| Functions  | ' + fmt(s.functions)  + ' |');
              console.log('| Lines      | ' + fmt(s.lines)      + ' |');
            " >> $GITHUB_STEP_SUMMARY
          fi
